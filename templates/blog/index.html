{% extends "base.html" %}

{% block content %}
  <h1>Post list </h1>
  {% if post_list %}
    <ul>
      {% for post in post_list %}
        <li>
            <p>{{post.id}} {{post.title}} (created by {{post.owner}})
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no posts in blog</p>
  {% endif %}
{% endblock %}
